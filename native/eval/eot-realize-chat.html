<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fold — EOT ⇄ NL — prompt the realizer</title>
<style>
  :root { --bg:#0d0b16; --bg2:#141126; --bg3:#1b1735; --line:#2b2450; --line2:#3a3170; --ink:#ece9fb; --muted:#8f88b3; --dim:#6b6492; --violet:#a78bfa; --violet2:#8b5cf6; --violet3:#7c3aed; --ok:#4ade80; --bad:#f87171; --amber:#fbbf24; --header-bg: rgba(13, 11, 22, .92); }
  * { box-sizing: border-box; } html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, serif; line-height: 1.55; display: flex; flex-direction: column; }
  .frame { position: sticky; top: 0; z-index: 30; background: var(--header-bg); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); padding: .5rem 1rem; }
  .row1 { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .mark { display: flex; align-items: center; gap: .5rem; font-family: ui-monospace, Menlo, monospace; font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .mark .dot { width: 11px; height: 11px; border-radius: 3px; background: linear-gradient(135deg, var(--violet), var(--violet3)); box-shadow: 0 0 12px rgba(139,92,246,.55); }
  .mark b { color: var(--ink); } .spacer { flex: 1; }
  .seal-mini { font-family: ui-monospace, monospace; font-size: .66rem; color: var(--ok); border: 1px solid var(--ok); border-radius: 999px; padding: .1rem .55rem; }
  .row2 { display: flex; gap: .35rem; flex-wrap: wrap; align-items: center; margin-top: .45rem; }
  .pill { font-family: ui-monospace, monospace; font-size: .68rem; padding: .12rem .5rem; border-radius: 999px; border: 1px solid var(--line2); color: var(--muted); cursor: pointer; background: var(--bg2); }
  .pill:hover { color: var(--ink); border-color: var(--violet2); } .pill.on { color: var(--violet); border-color: var(--violet2); } .pill .k { color: var(--dim); }
  main { flex: 1; overflow-y: auto; padding: 1rem 1rem 2rem; }
  #transcript { max-width: 54rem; margin: 0 auto; display: flex; flex-direction: column; gap: .8rem; }
  .msg { display: flex; gap: .6rem; align-items: flex-start; }
  .who { flex: none; width: 4.2rem; font-family: ui-monospace, monospace; font-size: .66rem; text-transform: uppercase; letter-spacing: .06em; padding-top: .35rem; }
  .you .who { color: var(--violet); } .bot .who { color: var(--ok); }
  .you .body { background: var(--bg3); border: 1px solid var(--violet3); }
  .body { min-width: 0; flex: 1; background: var(--bg2); border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; }
  .card { border-left: 2px solid var(--line2); padding: .3rem 0 .3rem .7rem; margin: .55rem 0; }
  .card .act { font-family: ui-monospace, monospace; font-size: .62rem; color: var(--dim); }
  .read { font-size: .98rem; margin-top: .25rem; } .read .tag { font-family: ui-monospace, monospace; font-size: .6rem; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
  .say { font-family: ui-monospace, monospace; font-size: .92rem; color: var(--ink); background: var(--bg3); border: 1px solid var(--line2); border-radius: 6px; padding: .4rem .55rem; margin-top: .3rem; white-space: pre-wrap; }
  .say b, .turn-sec .sec { color: var(--violet); font-weight: normal; }
  .scores { font-family: ui-monospace, monospace; font-size: .62rem; color: var(--muted); display: flex; gap: .7rem; margin-top: .3rem; flex-wrap: wrap; }
  .scores .ref { color: var(--dim); }
  .refusal { color: var(--muted); font-size: .92rem; }
  .turn-sec { font-family: ui-monospace, monospace; font-size: .72rem; color: var(--muted); margin: .15rem 0; }
  .turn-sec b { color: var(--ink); font-weight: normal; } .turn-sec .sec { text-transform: uppercase; letter-spacing: .08em; font-size: .62rem; }
  .refusal .try { margin-top: .4rem; display: flex; gap: .4rem; flex-wrap: wrap; }
  .refusal .try button { font-family: ui-monospace, monospace; font-size: .66rem; color: var(--violet); background: var(--bg3); border: 1px dashed var(--violet2); border-radius: 999px; padding: .1rem .5rem; cursor: pointer; }
  .hint { font-family: ui-monospace, monospace; font-size: .6rem; color: var(--dim); margin-top: .4rem; } .hint .go { color: var(--muted); }
  .inputbar { position: sticky; bottom: 0; z-index: 30; background: var(--header-bg); backdrop-filter: blur(6px); border-top: 1px solid var(--line); padding: .6rem 1rem; }
  .inputwrap { max-width: 54rem; margin: 0 auto; display: flex; gap: .5rem; align-items: center; }
  #prompt { flex: 1; background: var(--bg2); border: 1px solid var(--line2); border-radius: 8px; color: var(--ink); font-family: Georgia, serif; font-size: .98rem; padding: .55rem .7rem; outline: none; }
  #prompt:focus { border-color: var(--violet2); }
  #send { font-family: ui-monospace, monospace; font-size: .72rem; color: var(--ink); background: linear-gradient(135deg, var(--violet2), var(--violet3)); border: none; border-radius: 8px; padding: .55rem .9rem; cursor: pointer; }
  #send:disabled { opacity: .4; cursor: wait; }
  .realm { max-width: 54rem; margin: 0 auto 1rem; font-family: ui-monospace, monospace; font-size: .62rem; color: var(--dim); display: flex; gap: .8rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: .5rem; }
  .realm b { color: var(--muted); font-weight: normal; }
</style>
</head>
<body>
<header class="frame">
  <div class="row1">
    <div class="mark"><span class="dot"></span><b>The Fold</b>&nbsp;· EOT ⇄ NL — prompt the realizer</div>
    <div class="spacer"></div>
    <div class="seal-mini" id="seal">no model on the reverse leg</div>
  </div>
  <div class="row2" id="registerRow"></div>
</header>
<main>
  <div class="realm" id="realm"></div>
  <div id="transcript"></div>
</main>
<footer class="inputbar">
  <div class="inputwrap">
    <input id="prompt" autocomplete="off" spellcheck="false" placeholder="Ask what you need — “who is the black spot”, “what is this book about?”, “monkeys in the condo” …">
    <button id="send">speak →</button>
  </div>
</footer>
<script>
const $ = (s) => document.querySelector(s);
const main = $("main");
const state = { register: null, registers: [], ready: false };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function boot() {
  const r = await (await fetch("/registers")).json();
  state.registers = r.registers ?? [];
  state.register = state.registers.find((x) => x.name === r.default)?.name ?? state.registers[0]?.name ?? "literature-books";
  renderRegisters(); renderRealm();
  addLine("bot", `READ → ADMIT → <b>void</b> → <b>hunt</b> → <b>admit</b> → ANSWER. Every reply reasons over the hyperlexicon and the holograph, auditably. The <b>void</b> is the ask parsed by closed-class grammar; the <b>hunt</b> scans every passage holding the referent's words by address; a definition is <b>admitted</b> only when its subject binds to the <b>same referent</b> the ask names — spelling is never the crutch. If no passage defines it, it <b>refuses</b> and says what would. The registers include material that is <b>not all proper English</b>: ask <b>cosem</b> or <b>ubuntu-irc</b>.`);
  if (!state.ready) { state.ready = true; $("#prompt").focus(); }
}
function renderRegisters() {
  const row = $("#registerRow"); row.innerHTML = "";
  for (const reg of state.registers) {
    const b = document.createElement("button");
    b.className = "pill" + (reg.name === state.register ? " on" : "");
    b.textContent = reg.name; b.title = reg.label;
    b.onclick = () => { state.register = reg.name; renderRegisters(); renderRealm(); addLine("bot", `Now reading <b>${esc(reg.label)}</b>. Ask in its own words.`); };
    row.appendChild(b);
  }
}
function renderRealm() {
  const reg = state.registers.find((x) => x.name === state.register);
  const parts = [`register <b>${esc(state.register)}</b>`];
  if (reg?.loaded) parts.push(`<b>${reg.loaded.sentences}</b> passages · <b>${reg.loaded.addressed}</b> addressed`);
  if (reg?.measured) parts.push(`measured: forms <b>${reg.measured.formPct}%</b> · word+pos <b>${reg.measured.avgWordPct}%</b>`);
  $("#realm").innerHTML = parts.join(" &nbsp;·&nbsp; ");
}
function addLine(who, html) {
  const m = document.createElement("div");
  m.className = "msg " + who;
  m.innerHTML = `<div class="who">${who === "you" ? "you" : "eot"}</div><div class="body">${html}</div>`;
  $("#transcript").appendChild(m); main.scrollTop = main.scrollHeight; return m;
}
function renderReply(row) {
  const body = document.createElement("div"); body.className = "body";
  const social = ["greeting", "thanks", "goodbye", "help"].includes(row.void?.kind);
  body.innerHTML = `<div class="say"><b>${social ? "REPLY" : "ANSWER"}</b> ${esc(row.reply ?? row.answer ?? row.finding ?? "")}</div>`;
  if (!social) {
    const need = row.void ?? {};
    const voidRef = row.voidReferent?.name ? ` → referent <b>${esc(row.voidReferent.name)}</b>` : "";
    body.innerHTML += `
      <div class="turn-sec"><span class="sec">void</span> kind <b>${esc(need.kind)}</b>${need.opener ? ` (opener <b>${esc(need.opener)}</b>)` : ""} · words <b>${esc((need.needWords ?? []).join(" "))}</b>${voidRef}</div>
      <div class="turn-sec"><span class="sec">hunt</span> <b>${row.hunt?.refs ?? 0}</b> passage(s) hold the words · <b>${row.hunt?.candidates ?? 0}</b> defining candidate(s) · <b>${row.hunt?.admitted ?? 0}</b> admitted</div>
      <div class="turn-sec"><span class="sec">admit</span> a definition connects only when its subject binds to the <b>same referent</b> (aliases fold onto one id)</div>`;
    for (const h of row.hunt?.passages ?? []) {
      const card = document.createElement("div"); card.className = "card";
      card.innerHTML = `<div class="act">${esc(h.connect ?? "")} · referent <b>${esc((h.referent ?? []).map((r) => r.name).join(" | ") || "—")}</b> · ${esc(h.kind)} · score ${h.score}</div><div class="read"><span class="tag">hunted</span> ${esc(h.source)}</div><div class="scores"><span class="ref">@ ${esc(h.ref)}</span></div>`;
      body.appendChild(card);
    }
  }
  body.innerHTML += `<div class="hint"><span class="go">${row.ms} ms</span> · follow-ups bind to the last turn's referent · reverse leg: grammar only · the lens is ${esc(row.lens)}</div>`;
  const m = document.createElement("div"); m.className = "msg bot"; m.innerHTML = `<div class="who">eot</div>`; m.appendChild(body);
  $("#transcript").appendChild(m); main.scrollTop = main.scrollHeight;
}
async function send() {
  const prompt = $("#prompt").value.trim();
  if (!prompt || !state.ready) return;
  addLine("you", esc(prompt));
  $("#prompt").value = ""; const sendBtn = $("#send"); sendBtn.disabled = true;
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt, register: state.register }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error ?? res.status);
    renderReply(data);
    if (data.registers) { state.registers = data.registers.registers ?? data.registers; renderRealm(); }
  } catch (e) { addLine("bot", `<div class="refusal">the door refused: ${esc(e.message)}</div>`); }
  finally { sendBtn.disabled = false; $("#prompt").focus(); }
}
$("#send").addEventListener("click", send);
$("#prompt").addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
boot();
</script>
</body>
</html>
