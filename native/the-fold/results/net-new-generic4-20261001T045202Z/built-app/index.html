<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Air Quality · Sunrise</title>
<style>:root{--bg:#f6f7f9;--fg:#15181d;--mut:#5b6472;--line:#dde1e7;--surf:#fff}@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--fg:#e6e9ee;--mut:#9aa4b2;--line:#252c36;--surf:#171c23}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,sans-serif;padding:16px}main{max-width:640px;margin:0 auto}h1{font-size:1.2rem;margin:0 0 12px}form{display:flex;gap:8px;margin-bottom:16px}input{flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surf);color:var(--fg);font:inherit}button{padding:10px 14px;border:0;border-radius:8px;background:var(--fg);color:var(--bg);font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.card{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:14px;overflow-wrap:anywhere}.card b{display:block;font-size:1.5rem}.card span{color:var(--mut)}.gap{padding:14px;border:1px dashed var(--line);border-radius:12px;color:var(--mut)}footer{margin-top:20px;color:var(--mut);font-size:.85rem}</style>
<main><h1 id="h">Air Quality · Sunrise</h1><form id="f"><input id="p" value="London" aria-label="place"><button>Show</button></form><div id="o" class="grid"></div><footer><a href="/about.html">where every value comes from</a></footer></main>
<script>const o=document.getElementById('o'),esc=s=>String(s).replace(/</g,'&lt;');async function go(p){o.innerHTML='<div class="gap">loading…</div>';try{const r=await (await fetch('/api/read?place='+encodeURIComponent(p))).json();if(r.gap){o.innerHTML='<div class="gap">'+esc(r.gap)+'</div>';return}document.getElementById('h').textContent="Air Quality · Sunrise"+' — '+r.place.name;o.innerHTML=r.fields.map(f=>'<div class="card"><span>'+esc(f.label.replace(/_/g,' '))+'</span><b>'+esc(f.value??'—')+'</b><span>'+esc(f.unit||'')+'</span></div>').join('')}catch(e){o.innerHTML='<div class="gap">could not read: '+esc(e.message)+'</div>'}}document.getElementById('f').onsubmit=e=>{e.preventDefault();go(document.getElementById('p').value)};go(document.getElementById('p').value)</script></html>
