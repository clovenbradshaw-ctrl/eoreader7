<!DOCTYPE html>
<html>
<head>
  <title>Podcast List</title>
  <style>
body {
  margin: 0;
  overflow-x: hidden;
  box-sizing: border-box;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  /* Real, well-supported CSS: tells the browser to draw its NATIVE form
     and media controls (audio, input, scrollbars) in dark mode, so
     <audio controls> doesn't render as a bright white bar in a dark app. */
  color-scheme: dark;

  background-color: #0d0f13;
  color: #ffffff;
}

html {
  box-sizing: border-box;
}

h1 {
  font-weight: bold;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  padding: 24px 16px;
  box-sizing: border-box;
}

input[type="text"] {
  padding: 10px;
  margin-bottom: 10px;
  border: 1px solid #ccc;
  border-radius: 5px;
}

button {
background-color: #1DB954;

  padding: 10px 20px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
  color: rgb(0, 0, 0);
}

.episode {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
  width: 100%;
  padding: 16px;
  margin-bottom: 16px;
  border-radius: 8px;
  background-color: #191919;
}

.episode-meta {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 8px;
}

.episode h3 {
  width: 100%;
  text-align: left;
  margin: 0 0 4px;
  font-size: 16px;
}

.episode p {
  margin: 0;
  text-align: left;
  color: #b3b3b3;
  font-size: 13px;
  white-space: nowrap;
}

.ethos-badge {
display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
  color: rgb(0, 0, 0);
}

.episode audio {
  width: 100%;
  box-sizing: border-box;
}

.episode:first-of-type h3 {
  color: #1db954;
}
  </style>
</head>
<body>
  <div class="container">
    <h1>Podcast List</h1>
    <input type="text" placeholder="Enter feed URL" />
    <button onclick="subscribe()">Subscribe</button>
  </div>
  <div id="episodes"></div>
  <script>
function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function renderEpisodes(episodes) {
  const episodesContainer = document.getElementById("episodes");
  episodesContainer.innerHTML = ""; // Clear the container

  episodes.forEach(episode => {
    const episodeDiv = document.createElement("div");
    episodeDiv.className = "episode";
    const ethosLabel = episode.ethos === "pass" ? "clears the ethos check" : episode.ethos === "conflict" ? "flagged by the ethos check" : "ethos check not run";
    episodeDiv.innerHTML = `<h3>${escapeHtml(episode.title)}</h3><div class="episode-meta"><span class="ethos-badge" title="${escapeHtml(ethosLabel)}" style="background-color: ${episode.ethos === "pass" ? "green" : episode.ethos === "conflict" ? "red" : "gray"}"></span><p>Published: ${escapeHtml(episode.pubDate)}</p></div><audio controls src="${episode.audioUrl}"></audio>`;
    episodesContainer.appendChild(episodeDiv);
  });
  return episodesContainer;
}

function subscribe() {
  const urlInput = document.querySelector('input[type="text"]');
  const url = urlInput.value;
  
  fetch(`/api/subscribe?url=${encodeURIComponent(url)}`)
    .then(response => {
      if (!response.ok) {
        throw new Error(`Network response was not ok: ${response.status}`);
      }
      return response.json();
    })
    .then(data => {
      if (data.show) {
        renderEpisodes(data.episodes);
      }
    })
    .catch(error => {
      const errorMessage = `Error subscribing to podcast: ${error.message}`;
      document.getElementById('episodes').textContent = errorMessage;
    });
}
  </script>
</body>
</html>
