<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Polanyi — the expertise archon</title>
<style>
  :root { --bg:#0c0d10; --bg2:#15171b; --ink:#e8e6e1; --muted:#9a9a94; --dim:#5c5c58; --line:#2a2c31; --accent:#c9a15a; --good:#7fae6b; --warn:#c97a5a; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family: ui-monospace, Menlo, monospace; font-size: 13px; }
  header { display:flex; align-items:center; justify-content:space-between; padding:.7rem 1rem; border-bottom:1px solid var(--line); }
  header h1 { font-size:.85rem; letter-spacing:.08em; text-transform:uppercase; margin:0; color:var(--accent); font-weight:normal; }
  header .sub { color:var(--dim); font-size:.72rem; margin-left:.6rem; }
  #gh button, #push { background:var(--bg2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:.35rem .7rem; cursor:pointer; font-family:inherit; font-size:.72rem; }
  #gh button:hover, #push:hover { border-color: var(--accent); }
  #gh .who { display:flex; align-items:center; gap:.4rem; color:var(--muted); }
  #gh img { width:18px; height:18px; border-radius:50%; }
  main { display:grid; grid-template-columns: 1fr 340px; grid-template-rows: 1fr 220px; height: calc(100vh - 48px); }
  #hero { grid-column:1; grid-row:1; padding:1rem; overflow-y:auto; border-right:1px solid var(--line); position:relative; }
  #hero .bar { display:flex; gap:.5rem; margin-bottom:.8rem; align-items:center; }
  #hero .bar button { background:none; border:1px solid var(--line); color:var(--muted); padding:.25rem .6rem; border-radius:5px; cursor:pointer; font-family:inherit; font-size:.68rem; }
  #hero .bar button.on { color:var(--accent); border-color:var(--accent); }
  #hero .status { color:var(--dim); font-size:.72rem; margin-left:auto; }
  #absorb .item { margin-bottom:1rem; padding-bottom:1rem; border-bottom:1px dashed var(--line); }
  #absorb .url { color:var(--accent); font-size:.7rem; word-break:break-all; }
  #absorb .meta { color:var(--dim); font-size:.68rem; margin:.2rem 0 .4rem; }
  #absorb .excerpt { color:var(--muted); white-space:pre-wrap; line-height:1.5; max-height:6em; overflow:hidden; }
  #absorb .fetching .excerpt { color:var(--dim); font-style:italic; }
  #fold .form { margin-bottom:1.2rem; }
  #fold .form h3 { margin:0 0 .3rem; color:var(--ink); font-size:.8rem; }
  #fold .form .line { color:var(--muted); font-size:.72rem; padding:.1rem 0; }
  #fold .status-confirmed { color:var(--good); } #fold .status-provisional { color:var(--warn); }
  #log { grid-column:2; grid-row:1 / span 2; border-left:1px solid var(--line); overflow-y:auto; padding:.7rem; }
  #log h2 { font-size:.7rem; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); margin:.2rem 0 .7rem; }
  #log .entry { border-left:2px solid var(--line); padding:.4rem .6rem; margin-bottom:.5rem; font-size:.7rem; }
  #log .entry.confirmed { border-color:var(--good); } #log .entry.provisional { border-color:var(--warn); }
  #log .entry .name { color:var(--ink); font-weight:bold; }
  #log .entry .meta { color:var(--dim); }
  #chat { grid-column:1; grid-row:2; border-top:1px solid var(--line); display:flex; flex-direction:column; }
  #chat .msgs { flex:1; overflow-y:auto; padding:.6rem 1rem; }
  #chat .msg { margin-bottom:.5rem; font-size:.76rem; line-height:1.4; }
  #chat .msg.user { color:var(--ink); } #chat .msg.polanyi { color:var(--muted); }
  #chat .msg .who { color:var(--dim); font-size:.65rem; text-transform:uppercase; margin-right:.4rem; }
  #chat .links { display:flex; gap:.3rem; flex-wrap:wrap; margin:.3rem 0 0 3.4rem; }
  #chat .links .chip { background:var(--bg2); border:1px solid var(--line); border-radius:10px; padding:.15rem .5rem; font-size:.65rem; color:var(--accent); }
  #chat form { display:flex; gap:.5rem; padding:.5rem; border-top:1px solid var(--line); }
  #chat input[type=text] { flex:1; background:var(--bg2); border:1px solid var(--line); border-radius:6px; color:var(--ink); padding:.45rem .6rem; font-family:inherit; font-size:.76rem; }
  #chat select, #chat button { background:var(--bg2); border:1px solid var(--line); border-radius:6px; color:var(--muted); font-family:inherit; font-size:.72rem; padding:.4rem .6rem; cursor:pointer; }
  #plan { background:var(--bg2); border:1px solid var(--line); border-radius:8px; padding:.6rem; margin:0 1rem .5rem; font-size:.72rem; display:none; }
  #plan.show { display:block; }
  #plan .row { display:flex; gap:.4rem; margin:.3rem 0; align-items:center; }
  #plan label { color:var(--dim); width:80px; }
  #plan input { flex:1; background:var(--bg); border:1px solid var(--line); color:var(--ink); border-radius:4px; padding:.2rem .4rem; font-family:inherit; font-size:.7rem; }
  #plan button { margin-top:.3rem; }
</style>
</head>
<body>
<header>
  <div><h1>Polanyi</h1><span class="sub">the expertise archon — local model only, no frontier model</span></div>
  <div id="gh"><button id="ghLogin">Sign in with GitHub</button></div>
</header>
<main>
  <section id="hero">
    <div class="bar">
      <button id="viewAbsorb" class="on">absorbing</button>
      <button id="viewFold">fold (what it knows)</button>
      <span class="status" id="status">idle</span>
    </div>
    <div id="absorb"></div>
    <div id="fold" style="display:none"></div>
  </section>
  <section id="log"><h2>append-only log</h2><div id="logList"></div></section>
  <section id="chat">
    <div id="plan">
      <div class="row"><label>topic</label><input id="planTopic" placeholder="e.g. limerick, obituary, jig"/></div>
      <div class="row"><label>examples</label><input id="planSources" placeholder="links to real examples, comma-separated"/></div>
      <div class="row"><label>ground</label><input id="planPop" placeholder="links to its NEIGHBOURS (what it must be told apart from)"/></div>
      <button id="planGo">go learn this</button>
    </div>
    <div class="msgs" id="msgs"></div>
    <form id="chatForm"><input type="text" id="chatInput" placeholder="steer Polanyi — name a topic, paste links, give feedback…" autocomplete="off"/><button type="submit">send</button></form>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

// ── GitHub device-flow login ──────────────────────────────────────────────
async function refreshMe() {
  const me = await fetch("/auth/me").then((r) => r.json());
  const box = $("#gh");
  if (me) { box.innerHTML = `<div class="who"><img src="${esc(me.avatar)}"/> ${esc(me.login)}</div><button id="pushBtn">push to live_priors</button>`;
    $("#pushBtn").onclick = async () => { $("#pushBtn").textContent = "pushing…"; const r = await fetch("/push", { method: "POST" }).then((x) => x.json());
      $("#pushBtn").textContent = r.ok ? `pushed → ${r.branch}` : `${r.error}`; };
  }
  return me;
}
$("#ghLogin").onclick = async () => {
  const d = await fetch("/auth/github/device", { method: "POST" }).then((r) => r.json());
  if (d.error) { alert(d.error); return; }
  window.open(d.verification_uri, "_blank");
  $("#gh").innerHTML = `<span class="sub">enter code <b>${esc(d.user_code)}</b> at github.com/login/device</span>`;
  const poll = setInterval(async () => {
    const r = await fetch("/auth/github/poll", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ device_code: d.device_code }) }).then((x) => x.json());
    if (r.ok) { clearInterval(poll); await refreshMe(); }
    else if (r.error && r.error !== "authorization_pending" && r.error !== "slow_down") { clearInterval(poll); $("#gh").innerHTML = `<span class="sub">${esc(r.error_description || r.error)}</span>`; }
  }, (d.interval || 5) * 1000);
};
refreshMe();

// ── hero: absorb vs fold ──────────────────────────────────────────────────
$("#viewAbsorb").onclick = () => { $("#viewAbsorb").classList.add("on"); $("#viewFold").classList.remove("on"); $("#absorb").style.display = ""; $("#fold").style.display = "none"; };
$("#viewFold").onclick = async () => { $("#viewFold").classList.add("on"); $("#viewAbsorb").classList.remove("on"); $("#absorb").style.display = "none"; $("#fold").style.display = ""; await renderFold(); };
async function renderFold() {
  const j = await fetch("/fold").then((r) => r.json());
  const box = $("#fold"); box.innerHTML = "";
  if (!j.forms.length) { box.appendChild(el("div", null, "<span style='color:var(--dim)'>nothing learned yet</span>")); return; }
  for (const f of j.forms) {
    const d = el("div", "form");
    d.appendChild(el("h3", `status-${f.status}`, `${esc(f.name)} — ${esc(f.status)} (revision ${f.revision}, corroborated by ${f.corroboration})`));
    for (const feat of (f.features || []).slice(0, 14)) d.appendChild(el("div", "line", esc(feat.key) + (feat.same?.length ? ` <span style="color:var(--dim)">(+${feat.same.length})</span>` : "")));
    box.appendChild(d);
  }
}

// ── append-only log ─────────────────────────────────────────────────────
function logEntry(e) {
  const d = el("div", `entry ${e.confirmed ? "confirmed" : e.status}`);
  d.innerHTML = `<span class="name">${esc(e.topic)}</span> <span class="meta">rev ${e.revision} · ${esc(e.status)}${e.confirmed ? " · CONFIRMED" : ""} · corroborated ${e.corroboration}</span>`;
  $("#logList").appendChild(d);
  $("#logList").scrollTop = $("#logList").scrollHeight;
}

// ── live events ────────────────────────────────────────────────────────
const es = new EventSource("/events");
es.addEventListener("hello", (ev) => { const j = JSON.parse(ev.data); $("#status").textContent = `model: ${j.model}`; for (const f of j.forms) if (f.status) logEntry({ topic: f.name, revision: f.revision, status: f.status, corroboration: f.corroboration, confirmed: f.status === "confirmed" }); if (!j.github) $("#gh").title = "GITHUB_CLIENT_ID not set on the server"; });
es.addEventListener("status", (ev) => { const j = JSON.parse(ev.data); $("#status").textContent = j.phase + (j.reason ? `: ${j.reason}` : j.instances != null ? `: ${j.instances} instances / ${j.population} population` : ""); });
es.addEventListener("absorb", (ev) => {
  const j = JSON.parse(ev.data);
  const box = $("#absorb");
  let item = box.querySelector(`[data-url="${CSS.escape(j.url)}"]`);
  if (!item) { item = el("div", "item fetching"); item.dataset.url = j.url; item.innerHTML = `<div class="url">${esc(j.url)}</div><div class="meta"></div><div class="excerpt"></div>`; box.prepend(item); }
  item.className = "item" + (j.phase === "fetching" ? " fetching" : "");
  item.querySelector(".meta").textContent = j.phase === "fetching" ? `fetching (${j.hunt})…` : j.phase === "failed" ? `failed: ${j.error}` : `${j.hunt} · ${j.chars} chars · ${j.title || ""}`;
  if (j.excerpt) item.querySelector(".excerpt").textContent = j.excerpt;
});
es.addEventListener("ledger", (ev) => { logEntry(JSON.parse(ev.data)); if ($("#viewFold").classList.contains("on")) renderFold(); });

// ── chat ───────────────────────────────────────────────────────────────
let history = [];
function addMsg(who, text) { const m = el("div", `msg ${who}`); m.innerHTML = `<span class="who">${who}</span>${esc(text)}`; $("#msgs").appendChild(m); $("#msgs").scrollTop = $("#msgs").scrollHeight; return m; }
function showPlan(links) {
  $("#plan").classList.add("show");
  if (links.length) $("#planSources").value = links.join(", ");
}
$("#chatForm").onsubmit = async (e) => {
  e.preventDefault();
  const input = $("#chatInput"); const text = input.value.trim(); if (!text) return;
  addMsg("user", text); history.push({ role: "user", content: text }); input.value = "";
  const reply = addMsg("polanyi", "");
  const res = await fetch("/chat", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ history: history.slice(-8), message: text }) });
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "", full = "";
  while (true) {
    const { done, value } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let idx;
    while ((idx = buf.indexOf("\n\n")) >= 0) {
      const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
      const m = block.match(/event: (\w+)\ndata: (.*)/s); if (!m) continue;
      const [, ev, data] = m; const j = JSON.parse(data);
      if (ev === "token") { full += j; reply.innerHTML = `<span class="who">polanyi</span>${esc(full)}`; $("#msgs").scrollTop = $("#msgs").scrollHeight; }
      if (ev === "links" && j.length) showPlan(j);
    }
  }
  history.push({ role: "assistant", content: full });
};
$("#planGo").onclick = async () => {
  const topic = $("#planTopic").value.trim();
  const sourceUrls = $("#planSources").value.split(",").map((s) => s.trim()).filter(Boolean);
  const populationUrls = $("#planPop").value.split(",").map((s) => s.trim()).filter(Boolean);
  if (!topic || !sourceUrls.length || !populationUrls.length) { alert("a topic, its example links, and its ground (neighbour) links are all required — a hunt needs a proper relative ground"); return; }
  $("#viewAbsorb").click();
  $("#absorb").innerHTML = "";
  const r = await fetch("/learn", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ topic, sourceUrls, populationUrls, source: `surface:${topic}` }) }).then((x) => x.json());
  if (r.error) alert(r.error);
};
</script>
</body>
</html>
