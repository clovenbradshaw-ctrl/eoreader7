name: Native v7 kernel parity

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  native-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run native Fold parity gate
        working-directory: native
        run: npm test
