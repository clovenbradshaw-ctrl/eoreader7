name: Migrate native text organ

on:
  push:
    branches: [codex/native-text-frankenstein]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          submodules: recursive
          fetch-depth: 0
      - name: Copy tested text dependency closure native
        shell: bash
        run: |
          set -euo pipefail
          src=legacy-eoreader6.1/packages/engine/perceiver/text
          dst=native/adapters/text
          mkdir -p "$dst"
          for f in material.js spans.js priors.js surfaces.js relations.js recursive.js; do
            cp "$src/$f" "$dst/$f"
          done
          sed -i 's#"../../hypergraph/index.js"#"../../kernel/hypergraph.js"#' "$dst/recursive.js"
      - name: Verify adapter dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -nE 'legacy-eoreader6\.1|packages/engine' native/adapters/text; then
            echo 'native text adapter leaked a legacy path' >&2
            exit 1
          fi
          test "$(grep -R -h '^import ' native/adapters/text/*.js | grep -vc 'from "\./' || true)" -le 2
      - name: Commit migrated organ
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add native/adapters/text
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Migrate causal text organ native for v7'
          git push origin HEAD:codex/native-text-frankenstein
